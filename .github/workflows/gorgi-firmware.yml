name: Gorgi firmware

on:
  push:
    paths:
      - "esp32/ai-companion/**"
      - ".github/workflows/gorgi-firmware.yml"
  workflow_dispatch:
  workflow_call:  # used by gorgi-release.yml

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esp32/ai-companion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('esp32/ai-companion/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio esptool "click<8.2"  # the platform's esptool breaks with click 8.2+

      - name: Build
        run: pio run -e waveshare-s3-lcd7

      - name: Make a single flashable file
        run: |
          B=.pio/build/waveshare-s3-lcd7
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -1)
          python -m esptool --chip esp32s3 merge_bin -o gorgi-full.bin \
            --flash_mode keep --flash_freq keep --flash_size 8MB \
            0x0 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$BOOT_APP0" 0x10000 $B/firmware.bin
          cp $B/firmware.bin gorgi-firmware.bin  # the part sent over Wi-Fi for updates

      - name: Check the version matches esp32/VERSION (or esp32/TEST_VERSION for a test build)
        run: |
          V=$(tr -d '[:space:]' < ../VERSION)
          T=$(tr -d '[:space:]' < ../TEST_VERSION 2>/dev/null || true)
          grep -q "#define GORGI_VERSION \"$V\"" src/pclink.h || { [ -n "$T" ] && grep -q "#define GORGI_VERSION \"$T\"" src/pclink.h; } \
            || { echo "GORGI_VERSION in src/pclink.h is not $V (or test version $T)"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: gorgi-firmware
          retention-days: 30
          path: |
            esp32/ai-companion/gorgi-full.bin
            esp32/ai-companion/gorgi-firmware.bin
