; AI Companion for the Waveshare ESP32-S3-Touch-LCD-7 (800x480, GT911 touch)
; Open this folder in VS Code with the PlatformIO extension and press "Upload".

[env:waveshare-s3-lcd7]
; pioarduino = the community-maintained PlatformIO platform for Arduino-ESP32 3.x
; (ESP-IDF 5.4), which has the double-buffered LCD driver used by screen_esp32.cpp
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; The board has 8 MB flash and 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
board_build.f_cpu = 240000000L

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    bblanchon/ArduinoJson@7.2.1
    tzapu/WiFiManager@2.0.17
    links2004/WebSockets@2.6.1
